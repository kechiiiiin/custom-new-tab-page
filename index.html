<html lang="ja">

<body>

  <div class="right">

    <a id="apps-menu-btn" href="https://www.google.com/" target="_blank" rel="noopener" title="Google を開く" aria-label="Google を開く">

        <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>

        <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>

<div class="main">
  <aside class="sidebar">
    <div class="side-title">タグ</div>

      クリックで絞り込み（複数選択で AND）<br>

  <section class="content">

<!-- リンク編集モーダル -->
<div class="overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">リンクを追加</h3>
    <label>URL<input type="text" id="m-url" placeholder="https://github.com"></label>
    <label>名前<input type="text" id="m-label" placeholder="GitHub"></label>

<script>
/* HEADER CLOCK */
const DAYS=['日','月','火','水','木','金','土'];
function updateClock(){
  const n=new Date(),pad=v=>String(v).padStart(2,'0');
  document.getElementById('hdate').textContent=`${n.getMonth()+1}月${n.getDate()}日（${DAYS[n.getDay()]}）`;
  document.getElementById('htime').textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}`;
}
updateClock(); setInterval(updateClock,10*1000);

/* DATA STORAGE */
// v2: cols(カラム) → links(タグ付きフラットリスト)。memo / tasks は UI から外したがデータは保持
let AppData={version:2,links:[],memo:'',tasks:[]};
let saveTimer=null;
const STORAGE_KEY='dashboard_data';

function persist(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(AppData));}
  catch(e){console.warn('Save failed:',e);}
}
function saveData(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{persist();saveSnapshot();},400);
}

/* SNAPSHOT (File System Access API) */
const SNAPSHOT_DB='snapshot-config',SNAPSHOT_STORE='handles',SNAPSHOT_KEY='storage-history';
function openSnapshotDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(SNAPSHOT_DB,1);
    req.onupgradeneeded=()=>req.result.createObjectStore(SNAPSHOT_STORE);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function loadDirHandle(){
  try{
    const db=await openSnapshotDB();
    return await new Promise(resolve=>{
      const tx=db.transaction(SNAPSHOT_STORE,'readonly');
      const req=tx.objectStore(SNAPSHOT_STORE).get(SNAPSHOT_KEY);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>resolve(null);
    });
  }catch{return null;}
}
async function saveDirHandle(handle){
  const db=await openSnapshotDB();
  return new Promise(resolve=>{
    const tx=db.transaction(SNAPSHOT_STORE,'readwrite');
    tx.objectStore(SNAPSHOT_STORE).put(handle,SNAPSHOT_KEY);
    tx.oncomplete=()=>resolve();
  });
}
async function pickSnapshotDir(){
  if(!window.showDirectoryPicker){alert('このブラウザは File System Access API に対応していません');return null;}
  try{
    const handle=await window.showDirectoryPicker({id:'storage-history',mode:'readwrite'});
    await saveDirHandle(handle);
    return handle;
  }catch(e){if(e.name!=='AbortError')console.warn('pick dir failed:',e);return null;}
}
async function getDirHandleForWrite(){
  const handle=await loadDirHandle();
  if(!handle)return null;
  const opts={mode:'readwrite'};
  let perm=await handle.queryPermission(opts);
  if(perm==='granted')return handle;
  return null;
}
function snapshotDatePrefix(){
  const n=new Date(),pad=v=>String(v).padStart(2,'0');
  return `${n.getFullYear()}${pad(n.getMonth()+1)}${pad(n.getDate())}`;
}
function snapshotFilename(){
  const n=new Date(),pad=v=>String(v).padStart(2,'0');
  return `${snapshotDatePrefix()}${pad(n.getHours())}${pad(n.getMinutes())}${pad(n.getSeconds())}.json`;
}
const SNAPSHOT_MAX_FILES=30;
async function todaysSnapshotExists(dir){
  const prefix=snapshotDatePrefix();
  for await(const [name,h] of dir.entries()){
    if(h.kind==='file'&&/^\d{14}\.json$/.test(name)&&name.startsWith(prefix))return true;
  }
  return false;
}
async function pruneOldSnapshots(dir){
  try{
    const names=[];
    for await(const [name,h] of dir.entries()){
      if(h.kind==='file'&&/^\d{14}\.json$/.test(name))names.push(name);
    }
    if(names.length<=SNAPSHOT_MAX_FILES)return;
    names.sort();
    const toDelete=names.slice(0,names.length-SNAPSHOT_MAX_FILES);
    for(const name of toDelete){
      try{await dir.removeEntry(name);}catch(e){console.warn('Prune failed for',name,e);}
    }
  }catch(e){console.warn('Prune scan failed:',e);}
}
async function saveSnapshot(force=false){
  try{
    const dir=await getDirHandleForWrite();
    if(!dir)return false;
    if(!force&&await todaysSnapshotExists(dir))return false;
    const json=JSON.stringify(AppData,null,2);
    const file=await dir.getFileHandle(snapshotFilename(),{create:true});
    const writer=await file.createWritable();
    await writer.write(json);
    await writer.close();
    await pruneOldSnapshots(dir);
    return true;
  }catch(e){console.warn('Snapshot failed:',e);return false;}
}
document.getElementById('snapshot-config-btn').addEventListener('click',async()=>{
  const handle=await pickSnapshotDir();
  if(handle){await saveSnapshot(true);alert('保存先を設定しました。以後その日の最初の変更で自動保存されます。');}
});
document.getElementById('snapshot-save-btn').addEventListener('click',async()=>{
  const handle=await loadDirHandle();
  if(!handle){alert('先に 📁 から保存先を設定してください');return;}
  const opts={mode:'readwrite'};
  if(await handle.queryPermission(opts)!=='granted'&&await handle.requestPermission(opts)!=='granted'){
    alert('保存先への書き込みが許可されませんでした');return;
  }
  alert(await saveSnapshot(true)?'スナップショットを保存しました':'保存に失敗しました');
});

const LEGACY_APPS=[
  {label:'Obsidian',url:'obsidian://open',icon:'obsidian.md'},
  {label:'Slack',url:'slack://open',icon:'slack.com'},
  {label:'Discord',url:'discord://',icon:'discord.com'},
];
let linkIdCounter=Date.now();
function newId(){return 'l'+(linkIdCounter++).toString(36);}
function normTag(t){return t.trim().replace(/^#/,'').toLowerCase();}
function parseTags(s){return [...new Set(s.split(/[\s,、，]+/).map(normTag).filter(Boolean))];}

function migrate(s){
  // v1(カラム形式) → v2。カラム名をタグにし、元データは legacyCols に退避
  const links=[];
  (s.cols||[]).forEach(col=>{
    const tag=normTag(col.name||'');
    (col.links||[]).forEach(lk=>links.push({id:newId(),label:lk.label,url:lk.url,tags:tag?[tag]:[],clicks:0,lastUsed:0,created:Date.now()}));
  });
  LEGACY_APPS.forEach(a=>links.push({id:newId(),...a,tags:['app'],clicks:0,lastUsed:0,created:Date.now()}));
  return {version:2,links,memo:s.memo||'',tasks:s.tasks||[],legacyCols:s.cols||[]};
}
/* SERVICE TAG: URL からサービス名タグを判定 */
const SERVICE_RULES=[
  ['github',        (h)=>h==='github.com'],
  ['gitlab',        (h)=>h==='gitlab.com'],
  ['confluence',    (h,p)=>h.endsWith('.atlassian.net')&&p.startsWith('/wiki')],
  ['jira',          (h,p)=>h.endsWith('.atlassian.net')&&!p.startsWith('/wiki')],
  ['figma',         (h)=>h==='figma.com'],
  ['google-docs',   (h,p)=>h==='docs.google.com'&&p.startsWith('/document')],
  ['google-sheets', (h,p)=>h==='docs.google.com'&&p.startsWith('/spreadsheets')],
  ['google-slides', (h,p)=>h==='docs.google.com'&&p.startsWith('/presentation')],
  ['google-forms',  (h,p)=>h==='docs.google.com'&&p.startsWith('/forms')],
  ['google-drive',  (h)=>h==='drive.google.com'],
  ['google-calendar',(h)=>h==='calendar.google.com'],
  ['gmail',         (h)=>h==='mail.google.com'],
  ['aws',           (h)=>h.endsWith('.awsapps.com')||h==='aws.amazon.com'||h.endsWith('.aws.amazon.com')],
  ['slack',         (h,p,s)=>s==='slack:'||h==='slack.com'||h.endsWith('.slack.com')],
  ['discord',       (h,p,s)=>s==='discord:'||h==='discord.com'],
  ['obsidian',      (h,p,s)=>s==='obsidian:'],
  ['notion',        (h)=>h==='notion.so'||h.endsWith('.notion.site')],
  ['miro',          (h)=>h==='miro.com'],
  ['sentry',        (h)=>h==='sentry.io'||h.endsWith('.sentry.io')],
];
// 表示名とアイコン。icon は画像 URL かファビコン取得用のドメイン
const SERVICE_META={
  'github':{name:'GitHub',icon:'github.com'},
  'gitlab':{name:'GitLab',icon:'gitlab.com'},
  'confluence':{name:'Confluence',icon:'confluence.atlassian.com'},
  'jira':{name:'Jira',icon:'jira.atlassian.com'},
  'figma':{name:'Figma',icon:'figma.com'},
  'google-docs':{name:'Google ドキュメント',icon:'https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico'},
  'google-sheets':{name:'Google スプレッドシート',icon:'https://ssl.gstatic.com/docs/spreadsheets/favicon3.ico'},
  'google-slides':{name:'Google スライド',icon:'https://ssl.gstatic.com/docs/presentations/images/favicon5.ico'},
  'google-forms':{name:'Google フォーム',icon:'https://ssl.gstatic.com/docs/forms/device_home/android_192.png'},
  'google-drive':{name:'Google ドライブ',icon:'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png'},
  'google-calendar':{name:'Google カレンダー',icon:'calendar.google.com'},
  'gmail':{name:'Gmail',icon:'mail.google.com'},
  'aws':{name:'AWS',icon:'aws.amazon.com'},
  'slack':{name:'Slack',icon:'slack.com'},
  'discord':{name:'Discord',icon:'discord.com'},
  'obsidian':{name:'Obsidian',icon:'obsidian.md'},
  'notion':{name:'Notion',icon:'notion.so'},
  'miro':{name:'Miro',icon:'miro.com'},
  'sentry':{name:'Sentry',icon:'sentry.io'},
};
function serviceTag(url){
  try{
    const u=new URL(url),h=u.hostname.replace(/^www\./,'');
    return SERVICE_RULES.find(([,test])=>test(h,u.pathname,u.protocol))?.[0]||'';
  }catch{return '';}
}
function addServiceTag(lk){
  const t=serviceTag(lk.url);
  if(t&&!lk.tags.includes(t))lk.tags.unshift(t);
  dropAliasTags(lk);
}
// サービス名タグと意味が重複する手書きタグ。サービス名タグがあるリンクからだけ外す
const TAG_ALIASES={
  'google-docs':['docs','ドキュメント','gdocs'],
  'google-sheets':['スプシ','sheets','spreadsheet','スプレッドシート'],
  'google-slides':['slides','スライド'],
  'google-drive':['drive','ドライブ'],
  'confluence':['コンフル','wiki'],
};
function dropAliasTags(lk){
  const drop=new Set(lk.tags.flatMap(t=>TAG_ALIASES[t]||[]));
  if(drop.size)lk.tags=lk.tags.filter(t=>!drop.has(t));
}

function initStorage(){
  try{
    const text=localStorage.getItem(STORAGE_KEY);
    if(text){
      const s=JSON.parse(text);
      if(!s.version||s.version<2||!Array.isArray(s.links)){AppData=migrate(s);persist();}
      else AppData={...AppData,...s};
      // v2 → v3: 既存リンクにサービス名タグを付与
      if(AppData.version<3){AppData.links.forEach(addServiceTag);AppData.version=3;persist();}
      // v3 → v4: サービス名タグと重複するタグを整理
      if(AppData.version<4){AppData.links.forEach(dropAliasTags);AppData.version=4;persist();}
      // v4 → v5: 並び順を手動（配列順）に。いま見えている「サービス別・よく使う順」で固定する
      if(AppData.version<5){
        AppData.links.sort((a,b)=>(b.clicks||0)-(a.clicks||0)||(b.lastUsed||0)-(a.lastUsed||0)||a.label.localeCompare(b.label,'ja'));
        AppData.links=[...groupBy(AppData.links,true)].flatMap(([,ls])=>ls);
        AppData.version=5;persist();
      }
    }
  }catch(e){console.warn('Load failed:',e);}
}

/* HELPERS */
function hostOf(url){try{const u=new URL(url);return /^https?:$/.test(u.protocol)?u.hostname.replace(/^www\./,''):u.protocol+'//';}catch{return '';}}
function hashHue(s){let h=0;for(const c of s)h=(h*31+c.codePointAt(0))>>>0;return h%360;}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function normalizeUrl(u){u=u.trim();if(!u)return '';return /^[a-z][a-z0-9+.-]*:/i.test(u)?u:'https://'+u;}
const s2=domain=>`https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;
function faviconEl(lk){
  const box=el('div','favicon');
  const svc=SERVICE_META[serviceTag(lk.url)];
  const domain=lk.icon||(/^https?:/i.test(lk.url)?hostOf(lk.url):'');
  // サービス固有アイコン → サイトのファビコン → 頭文字 の順に試す
  const srcs=[svc&&(/^https?:/.test(svc.icon)?svc.icon:s2(svc.icon)),domain&&s2(domain)].filter(Boolean);
  const fallback=()=>{box.textContent=(lk.label||'?').trim().charAt(0).toUpperCase();box.classList.add('letter');box.style.setProperty('--h',hashHue(lk.label||''));};
  if(!srcs.length){fallback();return box;}
  const img=document.createElement('img');img.alt='';img.loading='lazy';
  const next=()=>{const src=srcs.shift();if(src)img.src=src;else{img.remove();fallback();}};
  img.onerror=next;
  // s2 は未登録ドメインに 16px の地球儀を返すので、それも「なし」とみなす
  img.onload=()=>{if(img.src.includes('/s2/favicons')&&img.naturalWidth<=16)next();};
  next();box.appendChild(img);
  return box;
}
function tagChip(tag,onClick){
  const c=el('button','chip','#'+tag);c.style.setProperty('--h',hashHue(tag));
  if(onClick)c.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();onClick(tag);});
  return c;
}

/* STATE */
const state={query:'',tags:new Set(),sel:0};
let visible=[];

function allTags(){
  const m=new Map();
  AppData.links.forEach(l=>l.tags.forEach(t=>m.set(t,(m.get(t)||0)+1)));
  return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ja'));
}

function parseQuery(q){
  const words=[],tags=[];
  q.toLowerCase().split(/\s+/).filter(Boolean).forEach(w=>{
    if(w.startsWith('#')){if(w.length>1)tags.push(w.slice(1));}
    else words.push(w);
  });
  return {words,tags};
}
function matches(lk,{words,tags}){
  for(const t of state.tags)if(!lk.tags.includes(t))return false;
  for(const t of tags)if(!lk.tags.some(x=>x.startsWith(t)))return false;
  const hay=(lk.label+' '+lk.url+' '+lk.tags.join(' ')).toLowerCase();
  return words.every(w=>hay.includes(w));
}
function score(lk,words){
  // 名前の前方一致を優先
  const name=lk.label.toLowerCase();
  let s=0;words.forEach(w=>{if(name.startsWith(w))s+=3;else if(name.includes(w))s+=2;});
  return s;
}
function sortLinks(arr,words){
  // 並び順は AppData.links の配列順（手動）で固定。検索時だけ一致度を優先する
  return words.length?arr.sort((a,b)=>score(b,words)-score(a,words)):arr;
}

/* RENDER */
function toggleTag(t){state.tags.has(t)?state.tags.delete(t):state.tags.add(t);state.sel=0;render();}

function renderSidebar(){
  const list=document.getElementById('tag-list');list.innerHTML='';
  const all=el('button','tag-row'+(state.tags.size?'':' active'));
  all.append(el('span','tname','すべて'),el('span','tcount',AppData.links.length));
  all.addEventListener('click',()=>{state.tags.clear();state.sel=0;render();});
  list.appendChild(all);
  allTags().forEach(([t,n])=>{
    const row=el('button','tag-row'+(state.tags.has(t)?' active':''));
    row.style.setProperty('--h',hashHue(t));
    const dot=el('span','tdot');
    const ed=el('span','tedit','✎');ed.title='タグ名を変更 / 削除';
    ed.addEventListener('click',e=>{e.stopPropagation();renameTag(t);});
    row.append(dot,el('span','tname',t),ed,el('span','tcount',n));
    row.addEventListener('click',()=>toggleTag(t));
    list.appendChild(row);
  });
}
function renameTag(t){
  const next=prompt(`タグ「${t}」の新しい名前（空にすると全リンクから削除）`,t);
  if(next===null)return;
  const nt=normTag(next);
  AppData.links.forEach(l=>{
    if(!l.tags.includes(t))return;
    l.tags=l.tags.filter(x=>x!==t);
    if(nt&&!l.tags.includes(nt))l.tags.push(nt);
  });
  if(state.tags.delete(t)&&nt)state.tags.add(nt);
  saveData();render();
}

function renderActiveTags(){
  const box=document.getElementById('active-tags');box.innerHTML='';
  state.tags.forEach(t=>{const c=tagChip(t,toggleTag);c.classList.add('removable');box.appendChild(c);});
  box.style.display=state.tags.size?'flex':'none';
}

function cardEl(lk,selected){
  const a=el('a','link-card'+(selected?' selected':''));
  a.href=lk.url;a.dataset.id=lk.id;a.title=lk.url;
  const svcTag=serviceTag(lk.url);
  const body=el('div','lbody');
  body.appendChild(el('div','lname',lk.label));
  // サービス名はアイコンで分かるのでチップからは外し、サブタイトルに出す
  const sub=el('div','lsub');
  sub.appendChild(el('span','lhost',SERVICE_META[svcTag]?.name||hostOf(lk.url)||lk.url));
  lk.tags.filter(t=>t!==svcTag).forEach(t=>sub.appendChild(tagChip(t,toggleTag)));
  body.appendChild(sub);
  const eb=el('button','ledit','✎');eb.title='編集';
  eb.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openModal(lk.id);});
  a.append(faviconEl(lk),body,eb);
  a.addEventListener('click',()=>recordUse(lk));
  a.addEventListener('auxclick',e=>{if(e.button===1)recordUse(lk);});
  return a;
}
function groupKeys(){
  // リンクID → グループ。サービス外と1件だけのサービスは「その他」('')
  const cnt=new Map(),keys=new Map();
  AppData.links.forEach(l=>{const k=serviceTag(l.url);cnt.set(k,(cnt.get(k)||0)+1);});
  AppData.links.forEach(l=>{const k=serviceTag(l.url);keys.set(l.id,cnt.get(k)<2?'':k);});
  return keys;
}
function groupBy(links,byCount=false){
  // グループの並びは配列内で先に出てくる順（=手動の順）。「その他」は常に末尾
  const keys=groupKeys(),m=new Map();
  links.forEach(l=>{const k=keys.get(l.id);if(!m.has(k))m.set(k,[]);m.get(k).push(l);});
  return [...m.entries()].sort((a,b)=>(a[0]==='')-(b[0]==='')||(byCount?b[1].length-a[1].length:0));
}

/* DRAG & DROP: カードはグループ内で、見出しはグループごと入れ替え */
let drag=null;
function clearDropMarks(){document.querySelectorAll('.drop-before,.drop-after').forEach(e=>e.classList.remove('drop-before','drop-after'));}
function dropSide(e,target,vertical){
  const r=target.getBoundingClientRect();
  return vertical?(e.clientY<r.top+r.height/2?'before':'after'):(e.clientX<r.left+r.width/2?'before':'after');
}
function moveLink(id,targetId,side){
  const from=AppData.links.findIndex(l=>l.id===id);
  const [lk]=AppData.links.splice(from,1);
  let to=AppData.links.findIndex(l=>l.id===targetId);
  if(side==='after')to++;
  AppData.links.splice(to,0,lk);
}
function moveGroup(key,targetKey,side){
  const groups=groupBy(AppData.links).filter(([k])=>k!=='');
  const others=groupBy(AppData.links).find(([k])=>k==='')?.[1]||[];
  const from=groups.findIndex(([k])=>k===key);
  const [g]=groups.splice(from,1);
  let to=groups.findIndex(([k])=>k===targetKey);
  if(side==='after')to++;
  groups.splice(to,0,g);
  AppData.links=[...groups.flatMap(([,ls])=>ls),...others];
}
function enableCardDrag(a,lk,key){
  a.draggable=true;
  a.addEventListener('dragstart',e=>{drag={type:'card',id:lk.id,key};a.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/uri-list',lk.url);});
  a.addEventListener('dragend',()=>{drag=null;a.classList.remove('dragging');clearDropMarks();});
  a.addEventListener('dragover',e=>{
    if(drag?.type!=='card'||drag.key!==key||drag.id===lk.id)return;
    e.preventDefault();clearDropMarks();a.classList.add('drop-'+dropSide(e,a,false));
  });
  a.addEventListener('drop',e=>{
    if(drag?.type!=='card'||drag.key!==key||drag.id===lk.id)return;
    e.preventDefault();moveLink(drag.id,lk.id,dropSide(e,a,false));saveData();renderGrid();
  });
}
function enableGroupDrag(h,key){
  if(key==='')return;
  h.draggable=true;h.title='ドラッグでグループの順番を入れ替え';
  h.addEventListener('dragstart',e=>{drag={type:'group',key};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',key);});
  h.addEventListener('dragend',()=>{drag=null;clearDropMarks();});
  h.addEventListener('dragover',e=>{
    if(drag?.type!=='group'||drag.key===key)return;
    e.preventDefault();clearDropMarks();h.classList.add('drop-'+dropSide(e,h,true));
  });
  h.addEventListener('drop',e=>{
    if(drag?.type!=='group'||drag.key===key)return;
    e.preventDefault();moveGroup(drag.key,key,dropSide(e,h,true));saveData();renderGrid();
  });
}

function renderGrid(){
  const q=parseQuery(state.query);
  const filtering=!!(state.query.trim()||state.tags.size);
  // 文字検索中は一致度順のフラット表示（並べ替え不可）
  const grouped=!q.words.length;
  visible=sortLinks(AppData.links.filter(l=>matches(l,q)),q.words);
  if(grouped)visible=groupBy(visible).flatMap(([,ls])=>ls);
  if(state.sel>=visible.length)state.sel=Math.max(0,visible.length-1);
  const grid=document.getElementById('grid');grid.innerHTML='';
  if(grouped){
    let i=0;
    groupBy(visible).forEach(([k,ls])=>{
      const h=el('div','group-head');
      h.append(el('span','gname',SERVICE_META[k]?.name||(k?k:'その他')),el('span','gcount',ls.length));
      enableGroupDrag(h,k);
      grid.appendChild(h);
      ls.forEach(lk=>{const a=cardEl(lk,filtering&&i===state.sel);enableCardDrag(a,lk,k);grid.appendChild(a);i++;});
    });
  }else visible.forEach((lk,i)=>grid.appendChild(cardEl(lk,filtering&&i===state.sel)));
  document.getElementById('result-count').textContent=
    (state.query||state.tags.size)?`${visible.length} / ${AppData.links.length} 件`:`${AppData.links.length} 件`;
  const empty=document.getElementById('empty');
  if(visible.length){empty.style.display='none';}
  else{
    empty.style.display='block';
    empty.innerHTML='';
    if(!AppData.links.length)empty.textContent='まだリンクがありません。「＋ リンクを追加」から登録できます。';
    else if(state.query.trim()){
      empty.append('一致するリンクがありません。',el('br'),'Enter で ');
      empty.append(el('b',null,`「${state.query.trim()}」をGoogle検索`));
    }else empty.textContent='一致するリンクがありません。';
  }
}
function render(){renderSidebar();renderActiveTags();renderGrid();}

function recordUse(lk){
  // 同一タブ遷移で debounce が間に合わないので即時保存
  lk.clicks=(lk.clicks||0)+1;lk.lastUsed=Date.now();persist();
}

/* SEARCH & KEYBOARD */
const search=document.getElementById('search');
search.addEventListener('input',()=>{state.query=search.value;state.sel=0;renderGrid();});

function gridCols(){
  const g=document.getElementById('grid');
  return getComputedStyle(g).gridTemplateColumns.split(' ').filter(Boolean).length||1;
}
function moveSel(d){
  if(!visible.length)return;
  state.sel=Math.min(visible.length-1,Math.max(0,state.sel+d));
  document.querySelectorAll('.link-card').forEach((c,i)=>c.classList.toggle('selected',i===state.sel));
  document.querySelectorAll('.link-card')[state.sel]?.scrollIntoView({block:'nearest'});
}
function openSelected(newTab){
  const lk=visible[state.sel];
  if(!lk){
    const q=state.query.trim();
    if(q)location.href='https://www.google.com/search?q='+encodeURIComponent(q);
    return;
  }
  recordUse(lk);
  if(newTab)window.open(lk.url,'_blank');else location.href=lk.url;
}
search.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229)return;
  const caretAtEnd=search.selectionStart===search.value.length;
  if(e.key==='ArrowDown'){e.preventDefault();moveSel(gridCols());}
  else if(e.key==='ArrowUp'){e.preventDefault();moveSel(-gridCols());}
  else if(e.key==='ArrowRight'&&caretAtEnd&&(state.query||state.tags.size)){e.preventDefault();moveSel(1);}
  else if(e.key==='ArrowLeft'&&caretAtEnd&&state.sel>0&&(state.query||state.tags.size)){e.preventDefault();moveSel(-1);}
  else if(e.key==='Enter'){e.preventDefault();openSelected(e.metaKey||e.ctrlKey);}
  else if(e.key==='Escape'){
    if(search.value){search.value='';state.query='';}
    else state.tags.clear();
    state.sel=0;render();
  }
  else if(e.key==='Backspace'&&!search.value&&state.tags.size){
    state.tags.delete([...state.tags].pop());render();
  }
});
document.addEventListener('keydown',e=>{
  if(modal.classList.contains('open')){if(e.key==='Escape')closeModal();return;}
  if(document.activeElement===search||e.metaKey||e.ctrlKey||e.altKey)return;
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;
  if(e.key==='/'){e.preventDefault();search.focus();search.select();}
  else if(e.key.length===1){search.focus();}
});

/* MODAL */
const modal=document.getElementById('modal');
const mUrl=document.getElementById('m-url'),mLabel=document.getElementById('m-label'),mTags=document.getElementById('m-tags');
let editingId=null;
function openModal(id){
  editingId=id;const lk=id&&AppData.links.find(l=>l.id===id);
  document.getElementById('modal-title').textContent=lk?'リンクを編集':'リンクを追加';
  mUrl.value=lk?lk.url:'';mLabel.value=lk?lk.label:'';
  mTags.value=lk?lk.tags.join(' '):[...state.tags].join(' ');
  document.getElementById('m-delete').style.display=lk?'inline-block':'none';
  renderSuggest();
  modal.classList.add('open');(lk?mLabel:mUrl).focus();
}
function closeModal(){modal.classList.remove('open');search.focus();}
function renderSuggest(){
  const box=document.getElementById('m-suggest');box.innerHTML='';
  // 入力途中の最後のトークンを前方一致で補完候補にする
  const v=mTags.value,tokens=v.split(/[\s,、，]+/).filter(Boolean);
  const typing=v&&!/[\s,、，]$/.test(v);
  const partial=typing?normTag(tokens[tokens.length-1]):'';
  const done=new Set((typing?tokens.slice(0,-1):tokens).map(normTag));
  allTags().map(([t])=>t).filter(t=>!done.has(t)&&(!partial||(t.startsWith(partial)&&t!==partial))).slice(0,14)
    .forEach(t=>box.appendChild(tagChip(t,tag=>{
      const parts=mTags.value.split(/[\s,、，]+/).filter(Boolean);
      if(partial)parts.pop();
      parts.push(tag);mTags.value=parts.join(' ')+' ';mTags.focus();renderSuggest();
    })));
}
mTags.addEventListener('input',renderSuggest);
mUrl.addEventListener('blur',()=>{
  const u=normalizeUrl(mUrl.value);
  if(u&&!mLabel.value.trim())mLabel.value=hostOf(u);
});
function saveModal(){
  const url=normalizeUrl(mUrl.value),label=mLabel.value.trim()||hostOf(url);
  if(!url||!label){(url?mLabel:mUrl).focus();return;}
  const tags=parseTags(mTags.value);
  const lk=editingId&&AppData.links.find(l=>l.id===editingId);
  // 新規 or URL 変更時のみサービス名タグを自動付与（手で外したタグは復活させない）
  if(lk){
    const urlChanged=lk.url!==url;
    if(urlChanged)delete lk.icon;
    Object.assign(lk,{url,label,tags});
    if(urlChanged)addServiceTag(lk);else dropAliasTags(lk);
  }else{
    const nl={id:newId(),label,url,tags,clicks:0,lastUsed:0,created:Date.now()};
    addServiceTag(nl);AppData.links.push(nl);
  }
  saveData();render();closeModal();
}
document.getElementById('add-btn').addEventListener('click',()=>openModal(null));
document.getElementById('m-cancel').addEventListener('click',closeModal);
document.getElementById('m-save').addEventListener('click',saveModal);
document.getElementById('m-delete').addEventListener('click',()=>{
  const lk=AppData.links.find(l=>l.id===editingId);
  if(!lk||!confirm(`「${lk.label}」を削除しますか？`))return;
  AppData.links=AppData.links.filter(l=>l.id!==editingId);saveData();render();closeModal();
});
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
[mUrl,mLabel,mTags].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();saveModal();}}));

/* AUTO RELOAD (非アクティブ時のみ) */
const RELOAD_INTERVAL_MS=60*1000;
setInterval(()=>{if(document.hidden)location.reload();},RELOAD_INTERVAL_MS);

/* INIT */
initStorage();
render();
search.focus();
</script>
